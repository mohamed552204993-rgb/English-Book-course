<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتاب الإنجليزي</title>
<script src="supabase-config.js" onerror="void 0"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6b5f"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كتاب الإنجليزي"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="تعلّم الإنجليزية من الصفر إلى الاحتراف بالعربية: دروس ونطق واختبارات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap">
<style>
/* Layout: a study desk. Green mat on a wooden table, an open book on the mat (spine on the right, red ribbon), floating tool bar at the bottom. */
:root{
  --wood:#a9764a; --grain:rgba(60,30,10,.08);
  --mat:#2f6b5f; --mat-line:#6aa397;
  --paper:#fbfcfe; --paper-2:#eef2f8; --ink:#17212f; --muted:#5a687b; --line:#d6deea;
  --cover:#2b4f9e; --accent:#2b4f9e; --on-accent:#ffffff; --ribbon:#c23a2e; --hl:#e9a93a;
  --good:#1b7f4f; --good-bg:#e1f3e8; --bad:#b8352a; --bad-bg:#fbe6e3;
  --bar:#102a27; --bar-fg:#e9f2ef;
  --ff-ar:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --ff-en:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wood:#2b1e15; --grain:rgba(0,0,0,.3);
    --mat:#143632; --mat-line:#2f6258;
    --paper:#101c2e; --paper-2:#172742; --ink:#e6edf7; --muted:#9db0c9; --line:#27395b;
    --cover:#3a64c0; --accent:#6a98f5; --on-accent:#08111f; --ribbon:#d9473a; --hl:#f0b64d;
    --good:#4cc38a; --good-bg:#12392a; --bad:#ff8074; --bad-bg:#3d1c1a;
    --bar:#0a1a18; --bar-fg:#e9f2ef; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wood:#2b1e15; --grain:rgba(0,0,0,.3);
  --mat:#143632; --mat-line:#2f6258;
  --paper:#101c2e; --paper-2:#172742; --ink:#e6edf7; --muted:#9db0c9; --line:#27395b;
  --cover:#3a64c0; --accent:#6a98f5; --on-accent:#08111f; --ribbon:#d9473a; --hl:#f0b64d;
  --good:#4cc38a; --good-bg:#12392a; --bad:#ff8074; --bad-bg:#3d1c1a;
  --bar:#0a1a18; --bar-fg:#e9f2ef; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--wood);
  background-image:repeating-linear-gradient(180deg,var(--grain) 0 1px,transparent 1px 8px);
  color:var(--ink); font-family:var(--ff-ar); font-size:16px; line-height:1.7;
  padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.desk{max-width:760px;margin:0 auto}
.mat{background:var(--mat);border-radius:22px;padding:12px 12px 14px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.mat::before{content:"";position:absolute;top:6px;right:6px;bottom:6px;left:6px;border:1.5px dashed var(--mat-line);border-radius:17px;pointer-events:none}
.tools{display:flex;gap:12px;align-items:center;padding:4px 14px 12px;position:relative}
.pencil{width:120px;height:9px;border-radius:1px 5px 5px 1px;background:linear-gradient(90deg,#e8a5a0 0 11%,#c8ccd3 11% 17%,#f2c14e 17%);transform:rotate(-2deg)}
.tools .lvl{margin-inline-start:auto;color:#e9f2ef;font-size:13px;opacity:.85}
.book{
  background:var(--paper);border-radius:14px 5px 5px 14px;border-right:14px solid var(--cover);
  position:relative;padding:26px 18px 28px;min-height:62vh;
  box-shadow:0 6px 14px rgba(0,0,0,.28),inset -14px 0 18px -14px rgba(0,0,0,.28);
}
.ribbon{position:absolute;top:-4px;left:26px;width:12px;height:50px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.en{font-family:var(--ff-en);font-size:1.14em;direction:ltr;unicode-bidi:isolate;font-weight:500}
.say{cursor:pointer;border-bottom:1.5px dotted var(--accent)}
.say:hover{background:var(--paper-2)}
h1{font-size:30px;line-height:1.25;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:21px;margin:18px 0 12px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:18px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* index */
.cover-sub{color:var(--muted);margin-bottom:16px;max-width:46ch}
.cont{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);margin-bottom:18px}
.cont .t{flex:1;min-width:160px}
.cont small{display:block;color:var(--muted)}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.lv{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--paper-2)}
.lv b{font-size:20px;font-family:var(--ff-en);font-weight:600}
.lv span{font-size:13px;color:var(--muted)}
.bar1{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar1 i{display:block;height:100%;background:var(--accent);border-radius:4px}
.unit{margin-top:22px}
.uhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.unum{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.uar{color:var(--muted);font-size:15px;font-weight:400}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lrow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:start;min-height:56px}
.lrow:hover{background:var(--paper-2)}
.lno{width:30px;height:30px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;border:1px solid var(--line)}
.lrow.done .lno{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.ltxt .en{font-size:18px}
.ltxt small{color:var(--muted);font-size:13.5px}
.stars{display:flex;gap:2px;color:var(--hl)}
.stars .off{color:var(--line)}
.go{color:var(--accent);font-size:13px;font-weight:600}

/* lesson */
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.seg{display:flex;gap:4px;margin-bottom:6px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.seg i.d{background:var(--accent)} .seg i.n{background:var(--hl)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);overflow:hidden;display:flex;flex-direction:column}
.vmain{border:0;background:none;padding:14px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.vmain .w{font-size:24px;line-height:1.2}
.vmain .a{color:var(--muted);font-size:15px}
.vmain svg{color:var(--accent);margin-top:4px}
.vex{border:0;border-top:1px solid var(--line);background:var(--paper);padding:9px 10px;cursor:pointer;font-size:15px;text-align:center;line-height:1.4}
.tip{font-size:17px}
.tbl{border-collapse:collapse;margin:8px 0 14px;width:100%}
.tbl td{border:1px solid var(--line);padding:8px 12px}
.tbl td:first-child{background:var(--paper-2);text-align:left}
.exhead{font-size:13px;color:var(--muted);margin-bottom:8px}
.qrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.q{font-size:18px;line-height:1.7;flex:1;min-width:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--hl);text-align:center;margin-inline:3px;font-weight:600}
.blank.ok{color:var(--good);border-color:var(--good)}
.spk{border:1.5px solid var(--line);background:var(--paper-2);color:var(--accent);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.spk.big{width:64px;height:64px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:12px 14px;font-size:17px;min-height:52px;cursor:pointer;text-align:center}
.opt.en{font-size:20px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{color:var(--ink);cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.slots{min-height:62px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--paper-2)}
.slots .ph{color:var(--muted);font-size:14px;width:100%;text-align:center}
.slots.right{border-color:var(--good);background:var(--good-bg)} .slots.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pool{min-height:52px;display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 14px;font-size:20px;min-height:44px;cursor:pointer;color:var(--ink)}
.wchip:disabled{color:var(--ink);cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)} .fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb .ans,.fb .why{margin-top:4px}
.sum{text-align:center;padding:8px 0}
.sum .big{font-size:44px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.sum .stars{justify-content:center;margin:10px 0}

/* bottom bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:min(420px,calc(100% - 32px));display:flex;justify-content:space-between;padding:6px;background:var(--bar);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.bar button{flex:1;background:none;border:0;color:var(--bar-fg);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:15px;font-size:11px;min-height:50px;cursor:pointer}
.bar button:hover:not(:disabled){background:rgba(255,255,255,.1)}
.bar button:disabled{opacity:.35;cursor:default}
.tchip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:20;background:var(--bar);color:var(--bar-fg);border:0;border-radius:999px;padding:6px 14px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-fg);padding:8px 16px;border-radius:12px;z-index:60;font-size:14px}

/* study center */
.backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:min(560px,100%);max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{border:1.5px solid var(--line);background:none;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14.5px;min-height:38px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.presets button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.presets button[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);font-weight:600}
.ringwrap{position:relative;width:200px;height:200px;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%}
.rbg{fill:none;stroke:var(--line);stroke-width:8}
.rfg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:326.73;transition:stroke-dashoffset .4s linear}
.rtxt{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rtxt b{font-size:42px;font-variant-numeric:tabular-nums;line-height:1.1}
.rtxt span{color:var(--muted);font-size:14px}
.center{text-align:center}
.center .row{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}
h4{margin:18px 0 6px;font-size:15px}
.prow{margin-bottom:14px}
.prow .top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:15px}
textarea{width:100%;min-height:180px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);color:var(--ink);padding:12px;font:inherit}
@media (min-width:560px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.book{padding:30px 34px 34px}.mat{padding:16px 18px 20px}}
@media (prefers-reduced-motion:reduce){.rfg{transition:none}}

.unit.locked{opacity:.55}.unit.locked .lrow{pointer-events:none}
.ubtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.ubtns button,.dash button{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px}
.ubtns button.pri{background:var(--accent);color:var(--on-accent)}.ubtns button:disabled{opacity:.4;cursor:not-allowed}
.dash{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:14px}
.dash .goal{flex:1 1 100%;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.dash .goal i{display:block;height:100%;background:var(--good)}
.xq{font-size:14px;color:var(--muted);margin-bottom:8px}.weak li{margin:4px 0}
.tin{width:100%;font-size:18px;padding:10px 12px;margin:10px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
/* Conversation trainer */
.conv-levels{display:flex;gap:7px;overflow-x:auto;padding:4px 1px 10px}
.conv-levels button{flex:none;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:7px 13px;font-weight:600}
.conv-levels button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.conv-card{border:1px solid var(--line);background:var(--paper-2);border-radius:13px;padding:13px;margin:9px 0}
.conv-card h4{margin:0 0 3px;font-size:17px}
.conv-card p{margin:0;color:var(--muted);font-size:13px}
.conv-line{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.conv-line:last-child{border-bottom:0}
.conv-speaker{flex:none;font-size:12px;font-weight:700;border-radius:8px;padding:3px 7px;background:var(--paper-2);border:1px solid var(--line)}
.conv-english{direction:ltr;text-align:left;flex:1;font-family:var(--ff-en);font-size:18px}
.conv-arabic{font-size:13px;color:var(--muted);text-align:right}
.conv-play{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:38px;height:38px;flex:none}
.conv-answer{border:1px solid var(--accent);background:var(--paper-2);border-radius:12px;padding:12px;margin:12px 0}
.conv-answer .model{direction:ltr;text-align:left;font-family:var(--ff-en);font-size:20px;margin:6px 0}
.conv-status{font-size:14px;color:var(--muted);margin-top:8px}
.conv-meter{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.conv-meter i{display:block;height:100%;background:var(--good);width:0}
</style>

</head><body>
<noscript><div style="padding:24px;font:18px/1.8 sans-serif;background:#fff;color:#000;direction:rtl">الجافاسكربت متوقف في هذا العارض. افتح الملف بمتصفح مثل Chrome: اضغط على الملف ثم «فتح باستخدام» واختر Chrome.</div></noscript>

  <button class="tchip" id="chip" hidden>تركيز 25:00</button>

      <div class="tools" aria-hidden="true"><span class="pencil"></span><span class="lvl" id="lvlTag"></span></div>
      <main class="book"><span class="ribbon" aria-hidden="true"></span><div id="page"></div></main>

<script>
window.addEventListener("error",function(e){var p=document.getElementById("page");if(p)p.innerHTML='<p style="padding:16px">حدث خطأ في التشغيل: '+e.message+'</p>';});
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const dirOf=t=>/[؀-ۿ]/.test(t)?'rtl':'ltr';
function h(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');

CURR.forEach(lv=>lv.units.forEach(u=>{unitNo++;u.no=unitNo;u.lessons.forEach((L,i)=>{Object.assign(L,{level:lv.level,unit:u,unitNo,idx:i+1});LESSONS.push(L);byId[L.id]=L;});}));

function meaningEx(v,L){
  const others=shuffle(L.vocab.filter(x=>x!==v)).slice(0,3);
  return {t:'mc',q:`ما معنى <span class="en">${v.en}</span>؟`,o:[v.ar,...others.map(x=>x.ar)],a:0,say:v.en,why:`<span class="en" dir="ltr">${v.ex}</span>`};
}
function listenEx(v,L){
  const others=shuffle(L.vocab.filter(x=>x!==v)).slice(0,3);
  return {t:'listen',say:v.en,o:[v.en,...others.map(x=>x.en)],a:0,why:`${v.en} = ${v.ar}`};
}
function lessonExercises(L){
  const v=L.vocab;
  return [meaningEx(v[0],L),listenEx(v[1],L),...L.ex.map(x=>({...x,_ord:null,_bank:null})),meaningEx(v[4],L)];
}

/* ---------- speech & sound ---------- */
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(err){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(err){}}
let CUR=null;
function speak(t){
  const d=AUDIO[t];
  if(d){try{if(CUR)CUR.pause();CUR=new Audio('data:audio/mpeg;base64,'+d);const pr=CUR.play();if(pr&&pr.catch)pr.catch(()=>toast('تعذر تشغيل الصوت. تأكد أن الجهاز ليس في الوضع الصامت.'));return;}catch(err){}}
  if(!('speechSynthesis' in window)){toast('الصوت غير متاح لهذه الجملة على جهازك');return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(err){}
}
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.28,.56].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.22);
      o.start(c.currentTime+t);o.stop(c.currentTime+t+.25);});}catch(err){}
}
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ---------- exercise renderers ---------- */
function fb(host,ok,correct,why){
  const old=$('.fb',host);if(old)old.remove();
  host.append(h('div',{class:'fb '+(ok?'ok':'bad'),role:'status'},
    h('b',{},ok?'أحسنت! إجابة صحيحة.':'ليست صحيحة.'),
    ok?null:h('div',{class:'ans'},'الإجابة الصحيحة: ',h('span',{dir:dirOf(correct),class:dirOf(correct)==='ltr'?'en':''},correct)),
    why?h('div',{class:'why',html:why}):null));
}
const spkBtn=(text,big)=>h('button',{type:'button',class:'spk'+(big?' big':''),'aria-label':'استمع',html:big?svg('<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',30):IC.spk,onclick:()=>speak(text)});

function renderEx(ex,host,prev,cb){
  host.innerHTML='';
  if(ex.t==='order')renderOrder(ex,host,prev,cb);else renderMC(ex,host,prev,cb);
}
function renderMC(ex,host,prev,cb){
  const isL=ex.t==='listen';
  const top=h('div',{class:'qrow'});
  top.append(isL?h('div',{class:'q',dir:'auto'},'اضغط على السماعة ثم اختر الكلمة التي سمعتها'):h('div',{class:'q',dir:'auto',html:ex.q.replace('___','<span class="blank"></span>')}));
  if(ex.say)top.append(spkBtn(ex.say,isL));
  host.append(top);
  const ord=ex._ord||(ex._ord=shuffle(ex.o.map((_,i)=>i)));
  const box=h('div',{class:'opts'});
  const btns=ord.map(i=>h('button',{type:'button',class:'opt'+(dirOf(ex.o[i])==='ltr'?' en':''),dir:dirOf(ex.o[i]),'data-i':i,onclick:()=>pick(i)},ex.o[i]));
  box.append(...btns);host.append(box);
  let locked=false;
  function lock(p){
    locked=true;
    btns.forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===ex.a)b.classList.add('right');else if(i===p)b.classList.add('wrong');});
    const bl=$('.blank',host);if(bl){bl.textContent=ex.o[ex.a];bl.classList.add('ok');}
    fb(host,p===ex.a,ex.o[ex.a],ex.why);
  }
  function pick(i){if(locked)return;if(cb)cb({ok:i===ex.a,pick:i});lock(i);}
  if(prev)lock(prev.pick);
}
function renderOrder(ex,host,prev,cb){
  const words=ex.s.split(' ');
  if(!ex._bank){let b,n=0;do{b=shuffle(words.map((_,i)=>i));n++;}while(b.every((v,i)=>v===i)&&n<10);ex._bank=b;}
  const bank=ex._bank;
  let picks=prev?prev.picks.slice():[];let locked=!!prev;
  host.append(h('div',{class:'q',dir:'auto',html:`رتّب الكلمات لتكوّن الجملة:<br><b>${ex.q}</b>`}));
  const slots=h('div',{class:'slots',dir:'ltr'});
  const pool=h('div',{class:'pool',dir:'ltr'});
  const check=h('button',{class:'btn',type:'button',onclick:doCheck},'تحقق');
  const clear=h('button',{class:'btn ghost',type:'button',onclick:()=>{if(locked)return;picks=[];draw();}},'مسح');
  host.append(h('div',{style:'margin-top:14px'}),slots,pool,h('div',{class:'row'},check,clear));
  function draw(){
    slots.innerHTML='';pool.innerHTML='';
    if(!picks.length)slots.append(h('span',{class:'ph',dir:'rtl'},'اضغط على الكلمات بالترتيب'));
    picks.forEach((bi,k)=>slots.append(h('button',{type:'button',class:'wchip en',disabled:locked,onclick:()=>{picks.splice(k,1);draw();}},words[bi])));
    bank.forEach(bi=>{if(!picks.includes(bi))pool.append(h('button',{type:'button',class:'wchip en',disabled:locked,onclick:()=>{picks.push(bi);draw();}},words[bi]));});
    check.disabled=locked||picks.length!==words.length;
    clear.disabled=locked||!picks.length;
  }
  function finish(ok){
    slots.classList.add(ok?'right':'wrong');
    check.hidden=true;clear.hidden=true;
    fb(host,ok,ex.s,ex.why);
    host.append(h('div',{class:'row'},h('button',{type:'button',class:'btn ghost',onclick:()=>speak(ex.s)},'استمع للجملة')));
  }
  function doCheck(){
    if(locked)return;
    const ok=orderOk(ex,picks.map(i=>words[i]).join(' '));
    locked=true;if(cb)cb({ok,picks:picks.slice()});draw();finish(ok);
  }
  draw();
  if(prev)finish(prev.ok);
}

    const ratio=ok/n;const low=ratio<.5;const first=S.done[L.id]==null&&!low;

    S.xpl=S.xpl||{};if(!low&&!S.xpl[L.id]){S.xpl[L.id]=1;today().lessons++;addXP(10+starsOf(ratio)*5);}save();

/* ---------- timer ---------- */
const PRESETS=[[25,5],[45,10],[15,3]];
const T={phase:'focus',left:PRESETS[S.preset||0][0]*60,running:false,end:0,last:0,note:''};
const phaseLen=()=>PRESETS[S.preset||0][T.phase==='focus'?0:1]*60;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function setPreset(i){S.preset=i;T.phase='focus';T.running=false;T.left=phaseLen();T.note='';save();renderSheet();updateChip();}
function toggleTimer(){
  if(T.running)T.running=false;else{T.running=true;T.end=Date.now()+T.left*1000;T.last=Date.now();T.note='';}
  updateTimerUI();updateChip();
}
function resetTimer(){T.running=false;T.left=phaseLen();T.note='';updateTimerUI();updateChip();}
function nextPhase(finished){
  if(T.phase==='focus'){if(finished){today().sessions++;}T.phase='break';T.note=finished?'انتهى وقت التركيز. خذ استراحة قصيرة.':'';}
  else{T.phase='focus';T.note='انتهت الاستراحة. جاهز لجلسة جديدة؟';}
  T.running=false;T.left=phaseLen();save();updateTimerUI();updateChip();
}
let tickN=0;
setInterval(()=>{
  if(T.running){
    const now=Date.now(),dt=(now-T.last)/1000;T.last=now;
    if(T.phase==='focus')today().sec+=dt;
    T.left=Math.max(0,Math.ceil((T.end-now)/1000));
    if(T.left<=0){beep();nextPhase(true);}
    if(++tickN%20===0)save();
    updateTimerUI();updateChip();
  }
},500);
function updateChip(){
  const c=$('#chip');
  const show=T.running||T.left!==phaseLen();
  c.hidden=!show;
  if(show)c.textContent=(T.phase==='focus'?'تركيز ':'استراحة ')+fmt(T.left);
}
function streak(){
  let n=0;const d=new Date();
  const act=k=>{const v=S.days[k];return v&&(v.sec>=60||v.lessons>0);};
  if(!act(dayKey(d)))d.setDate(d.getDate()-1);
  while(act(dayKey(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function updateTimerUI(){
  if(!$('#tleft'))return;
  $('#tleft').textContent=fmt(T.left);
  $('#tphase').textContent=T.phase==='focus'?'وقت التركيز':'وقت الاستراحة';
  $('#ring').style.strokeDashoffset=(326.73*(1-T.left/phaseLen())).toFixed(2);
  $('#tgo').textContent=T.running?'إيقاف مؤقت':(T.left===phaseLen()?'ابدأ':'تابع');
  $('#tnote').textContent=T.note||'ذاكر بتركيز كامل وأبعد الجوال، ثم خذ استراحة بعد كل جلسة.';
  const d=today();
  $('#sMin').textContent=Math.floor(d.sec/60);$('#sSes').textContent=d.sessions;$('#sStr').textContent=streak();
}

function startQuiz(){
  let pool=LESSONS.filter(l=>S.done[l.id]!=null);const fromDone=pool.length>0;

function renderQuiz(){
  const body=$('#sbody'),Q=R.quiz;
  if(!Q){
    body.innerHTML=`<p>اختبار سريع من ٦ أسئلة، مأخوذة من الدروس التي أنهيتها. إذا لم تنهِ أي درس بعد فستكون من الدروس الأولى.</p><div class="row"><button class="btn" id="qstart">ابدأ الاختبار</button></div>`;
    return;

let convLevel='A1',convId=null,convTurn=0,convScore=0,convBusy=false;
const convNorm=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
function convMatch(heard,target){
 const a=convNorm(heard).split(' ').filter(Boolean),b=convNorm(target).split(' ').filter(Boolean);
 if(!a.length||!b.length)return 0;
 const hit=b.filter(w=>a.some(x=>x===w||(w.length>4&&x.length>4&&lev(x,w)<=1))).length;
 return hit/b.length;
}
function convCurrent(){const group=CONV.find(x=>x.level===convLevel);return group&&group.items.find(x=>x.id===convId);}
function renderConversation(){
 const body=$('#sbody');
 const group=CONV.find(x=>x.level===convLevel);
 body.innerHTML='<p class="note">اختر مستواك، ثم افتح حواراً. اسمع الجمل، اقرأ معناها، وبعدها تدرّب على دورك بالميكروفون أو بالكتابة.</p>'+
 '<div class="conv-levels">'+CONV.map(x=>'<button data-conv-level="'+x.level+'" aria-pressed="'+(x.level===convLevel)+'">'+x.level+'</button>').join('')+'</div>'+
 group.items.map(x=>'<div class="conv-card"><h4>'+x.title+'</h4><p>'+x.scene+'</p><div class="row"><button class="btn" data-conv-open="'+x.id+'">افتح الحوار</button></div></div>').join('');
}
function convOpen(id){
 convId=id;convTurn=0;convScore=0;convBusy=false;renderConvDetail();
}
function renderConvDetail(){
 const body=$('#sbody'),d=convCurrent();if(!d)return;
 body.innerHTML='<button class="btn ghost" data-conv-back>← قائمة الحوارات</button><h3 style="margin-top:12px">'+d.title+'</h3><p class="note">'+d.scene+' · '+d.level+'</p>'+
 '<div class="row"><button class="btn" data-conv-playall>🔊 استمع للحوار كاملاً</button><button class="btn ghost" data-conv-start>🎤 تدرّب على دورك</button></div>'+
 '<div id="convTranscript">'+d.lines.map((l,i)=>'<div class="conv-line"><span class="conv-speaker">'+(l[0]==='A'?'المتحدث':'أنت')+'</span><div style="flex:1"><div class="conv-english">'+l[1]+'</div><div class="conv-arabic">'+l[2]+'</div></div><button class="conv-play" data-conv-say="'+i+'" aria-label="استمع">🔊</button></div>').join('')+'</div>'+
 '<div id="convPractice"></div>';
}
function convPlayAll(){
 const d=convCurrent();if(!d)return;
 try{if('speechSynthesis'in window)speechSynthesis.cancel();}catch(e){}
 d.lines.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang=S.accent==='UK'?'en-GB':'en-US';u.rate=S.slow?.72:.88;const v=voiceFor();if(v)u.voice=v;u.onstart=()=>{$$('#convTranscript .conv-line').forEach((el,j)=>el.style.background=j===i?'var(--paper-2)':'');};u.onend=()=>{if(i===d.lines.length-1)$$('#convTranscript .conv-line').forEach(el=>el.style.background='');};speechSynthesis.speak(u);});
}
function convStart(){
 const d=convCurrent();if(!d)return;convTurn=0;convScore=0;convBusy=false;convShowTurn();
}
function convShowTurn(){
 const d=convCurrent(),host=$('#convPractice');if(!d||!host)return;
 if(convTurn>=3){host.innerHTML='<div class="conv-answer"><h4>انتهى التدريب 🎉</h4><p>إجابات قريبة من النموذج: '+convScore+' من 3</p><p class="note">استمع للحوار مرة أخرى، وحاول تقوله دون النظر إلى الترجمة.</p><button class="btn" data-conv-restart>أعد التدريب</button></div>';return;}
 const a=d.lines[convTurn*2],b=d.lines[convTurn*2+1];
 host.innerHTML='<div class="conv-answer"><div class="note">دورك · السؤال '+(convTurn+1)+' من 3</div><div class="conv-english">'+a[1]+'</div><div class="conv-arabic">'+a[2]+'</div><div class="row"><button class="btn ghost" data-conv-prompt>🔊 اسمع السؤال</button></div><p class="note">ردّ بالإنجليزية. يمكنك التحدث أو كتابة إجابتك.</p><div class="model" id="convModel" hidden>'+b[1]+'</div><div class="conv-arabic" id="convTranslation" hidden>'+b[2]+'</div><div class="row"><button class="btn" data-conv-mic>🎤 تحدث</button><button class="btn ghost" data-conv-model>اعرض الإجابة النموذجية</button></div><textarea id="convTyped" rows="2" dir="ltr" placeholder="Type your answer in English..." style="width:100%;margin-top:8px"></textarea><div class="row"><button class="btn" data-conv-check>تحقق من إجابتي</button></div><div class="conv-status" id="convStatus" role="status"></div></div>';
}
async function convListen(){
 const d=convCurrent(),a=d&&d.lines[convTurn*2];if(a)speak(a[1]);
}
async function convMic(){
 if(convBusy)return;const Rec=SR();
 if(!Rec){$('#convStatus').textContent='التعرف على الكلام غير متاح في هذا المتصفح. اكتب إجابتك في المربع.';return;}
 if(!(await micEnsure())){$('#convStatus').textContent=micMsg(micCode())+' يمكنك كتابة إجابتك بدلاً من ذلك.';return;}
 const mic=$('[data-conv-mic]');mic.disabled=true;$('#convStatus').textContent='🎙️ استمع للسؤال ثم تحدث بالإنجليزية...';
 const rr=new Rec();rr.lang=S.accent==='UK'?'en-GB':'en-US';rr.maxAlternatives=3;rr.interimResults=false;rr.continuous=false;
 let heard='';
 rr.onresult=ev=>{heard=Array.from(ev.results[0]||[]).map(x=>x.transcript).join(' ');$('#convTyped').value=heard;};
 rr.onerror=ev=>{$('#convStatus').textContent='تعذر التعرف على الصوت ('+ev.error+'). اكتب إجابتك بدلاً من ذلك.';};
 rr.onend=()=>{mic.disabled=false;if(heard)$('#convStatus').textContent='سمعتُ: '+heard;};
 try{rr.start();}catch(e){mic.disabled=false;$('#convStatus').textContent='لم أستطع تشغيل الميكروفون. اكتب إجابتك.';}
}
function convCheck(){
 const d=convCurrent(),b=d&&d.lines[convTurn*2+1],typed=$('#convTyped')?.value||'';
 if(!typed.trim()){$('#convStatus').textContent='تحدث أو اكتب إجابتك أولاً.';return;}
 const ratio=convMatch(typed,b[1]),ok=ratio>=.48;
 if(ok)convScore++;
 $('#convStatus').textContent=(ok?'أحسنت! إجابتك قريبة من المعنى والكلمات المطلوبة. ':'حاول مرة أخرى بعد سماع النموذج. ')+
 'التطابق التقريبي: '+Math.round(ratio*100)+'٪. الإجابة النموذجية: '+b[1];
 const box=$('#convPractice .conv-answer');
 if(box&&!box.querySelector('[data-conv-next]'))box.append(h('div',{class:'row'},h('button',{type:'button',class:'btn', 'data-conv-next':'1',onclick:()=>{convTurn++;convShowTurn();}},convTurn===2?'عرض النتيجة':'السؤال التالي')));
}
document.addEventListener('click',ev=>{
 const t=ev.target;
 const lv=t.closest('[data-conv-level]');if(lv){convLevel=lv.dataset.convLevel;convId=null;renderConversation();return;}
 const op=t.closest('[data-conv-open]');if(op){convOpen(op.dataset.convOpen);return;}
 if(t.closest('[data-conv-back]')){convId=null;renderConversation();return;}
 if(t.closest('[data-conv-playall]')){convPlayAll();return;}
 if(t.closest('[data-conv-start]')){convStart();return;}
 const say=t.closest('[data-conv-say]');if(say){const d=convCurrent();if(d)speak(d.lines[+say.dataset.convSay][1]);return;}
 if(t.closest('[data-conv-prompt]')){convListen();return;}
 if(t.closest('[data-conv-mic]')){convMic();return;}
 if(t.closest('[data-conv-model]')){const d=convCurrent(),b=d.lines[convTurn*2+1];$('#convModel').hidden=false;$('#convTranslation').hidden=false;speak(b[1]);return;}
 if(t.closest('[data-conv-check]')){convCheck();return;}
 if(t.closest('[data-conv-restart]')){convStart();return;}
});
const _renderSheetBeforeConv=renderSheet;
renderSheet=function(){
 if(R.tab==='conversation'){
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===R.tab));
  renderConversation();
 }else _renderSheetBeforeConv();
};
})();

{title:'A customer complaint',ar:'شكوى عميل',text:'A small clothing shop received a complaint from a customer who had ordered a jacket in a particular colour. When the parcel arrived, the colour was noticeably different from the one shown online. The shop assistant apologised, checked the order, and offered either a replacement or a full refund. The customer chose a replacement. The assistant then arranged collection of the original jacket and promised to send the new one within three working days.',qs:[['What was wrong with the jacket?',['The size was too small','The colour was different','A button was missing'],1],['What options did the shop offer?',['A discount only','A replacement or refund','A free accessory'],1],['When would the new jacket be sent?',['Within three working days','The next month','That same evening'],0]]}
]},
{level:'B2',items:[
{title:'The value of public transport',ar:'أهمية النقل العام',text:'Many cities are investing in public transport to reduce congestion and air pollution. Expanding bus and rail networks can make commuting more reliable, but infrastructure alone is not enough. Services must be frequent, affordable, and connected to the places where people live and work. City planners also need to consider passengers with disabilities and those who travel late at night. A successful system is not simply one that moves large numbers of people; it is one that offers a practical alternative to private cars.',qs:[['According to the speaker, what is not enough on its own?',['Building infrastructure','Reducing ticket prices','Hiring more drivers'],0],['Which passengers should planners consider?',['Only office workers','Only tourists','People with disabilities and late-night travellers'],2],['How is a successful system described?',['As the cheapest possible system','As a practical alternative to private cars','As a way to remove all roads'],1]]},
{title:'Managing a project delay',ar:'إدارة تأخر مشروع',text:'The project team discovered that a key supplier would deliver essential components two weeks later than agreed. Rather than immediately changing the launch date, the manager reviewed which tasks could continue without those components. The team reorganised its schedule, completed documentation, and tested other parts of the product. The manager also informed the client about the risk and provided an updated timeline. Although the delay could not be eliminated, early communication helped maintain trust and prevented unnecessary downtime.',qs:[['How late would the components arrive?',['One week','Two weeks','A month'],1],['What did the team do while waiting?',['Stopped all work','Cancelled the project','Completed other tasks'],2],['What helped maintain the client’s trust?',['Early communication','A lower price','Hiring another manager'],0]]}
]},
{level:'C1',items:[
{title:'Why cities need green spaces',ar:'لماذا تحتاج المدن إلى المساحات الخضراء',text:'Urban green spaces are often defended on aesthetic grounds, yet their value extends considerably further. Trees can moderate local temperatures, while parks provide opportunities for exercise and informal social contact. Research also suggests that access to nature may support psychological well-being, although the strength of the effect varies across populations and settings. Nevertheless, simply creating a park does not guarantee equal benefits. Its location, maintenance, safety, and accessibility determine who can use it. Urban policy should therefore treat green space as essential infrastructure rather than a decorative luxury.',qs:[['What is the speaker’s main argument?',['Parks are mainly decorative','Green spaces should be treated as essential infrastructure','All cities need identical parks'],1],['What can affect who benefits from a park?',['Its location and accessibility','The colour of its benches','The age of nearby buildings'],0],['How certain is the evidence about psychological well-being?',['The effect is identical for everyone','There is no evidence at all','The effect varies by population and setting'],2]]},
{title:'The limits of productivity metrics',ar:'حدود قياس الإنتاجية',text:'Organisations frequently rely on measurable indicators to assess productivity, because numerical targets appear objective and easy to compare. Yet what is easiest to count is not necessarily what matters most. A support team, for example, may be rewarded for handling a high number of calls, even if customers leave with unresolved problems. Metrics can also encourage employees to optimise their individual scores at the expense of cooperation. This does not mean measurement should be abandoned. Rather, quantitative indicators should be interpreted alongside qualitative evidence and reviewed for unintended consequences.',qs:[['What is the central limitation of numerical targets?',['They are always inaccurate','They may measure what is easy rather than what matters','They are too expensive to collect'],1],['What behaviour might call-volume targets encourage?',['Solving complex issues','Avoiding all customer contact','Prioritising quantity over resolution'],2],['What does the speaker recommend?',['Combine metrics with qualitative evidence','Stop measuring performance','Use only individual rankings'],0]]}
]},
{level:'C2',items:[
{title:'Scientific uncertainty and public debate',ar:'عدم اليقين العلمي والنقاش العام',text:'Scientific uncertainty is sometimes portrayed as a weakness, particularly in public debates where audiences expect definitive answers. In reality, uncertainty is an intrinsic feature of inquiry: conclusions remain proportionate to the quality, scope, and limitations of available evidence. The difficulty arises when provisional findings are communicated without context, or when legitimate uncertainty is exploited to imply that nothing is known. Responsible communication must distinguish between genuine disagreement, ordinary margins of error, and claims that have been repeatedly contradicted. Such distinctions do not eliminate ambiguity, but they make public reasoning more intellectually honest.',qs:[['How does the speaker regard uncertainty?',['As an inherent part of scientific inquiry','As proof that research has failed','As something that should be concealed'],0],['What can happen when provisional findings lack context?',['They become automatically reliable','They may be misunderstood','They cannot be discussed'],1],['What is the purpose of distinguishing types of uncertainty?',['To remove every ambiguity','To end scientific debate','To support more intellectually honest reasoning'],2]]},
{title:'Technology and human judgement',ar:'التقنية والحكم البشري',text:'Automated systems can process information at a scale that would be impractical for human decision-makers. Their apparent consistency, however, should not be confused with neutrality. Systems reflect the objectives they are designed to optimise, the data on which they are trained, and the institutional settings in which they are deployed. Human oversight is therefore not merely a final approval step; it requires the capacity to question assumptions, detect disproportionate effects, and intervene meaningfully. The challenge is to establish accountability without discarding the genuine benefits of automation.',qs:[['Why should consistency not be confused with neutrality?',['Systems have no objectives','Systems reflect design choices and training data','Humans always make better predictions'],1],['What does meaningful oversight involve?',['Approving every output automatically','Avoiding all automated tools','Questioning assumptions and being able to intervene'],2],['What balance does the speaker seek?',['Accountability alongside the benefits of automation','Complete automation without review','A return to manual processing'],0]]}
]}
];
let level='A1',itemIndex=0,answers={};

function render(){const body=$('#sbody'),g=LISTEN.find(x=>x.level===level);body.innerHTML='<p class="note">استمع إلى النص كاملاً، ثم أجب عن أسئلة الفهم. حاول ألا تعرض النص الإنجليزي قبل الإجابة.</p><div class="conv-levels">'+LISTEN.map(x=>'<button data-listen-level="'+x.level+'" aria-pressed="'+(x.level===level)+'">'+x.level+'</button>').join('')+'</div>'+g.items.map((x,i)=>'<div class="conv-card"><h4>'+x.title+'</h4><p>'+x.ar+'</p><button class="btn" data-listen-open="'+i+'">ابدأ الاستماع والاختبار</button></div>').join('');}
function detail(){const d=current();answers={};$('#sbody').innerHTML='<button class="btn ghost" data-listen-back>← قائمة التدريبات</button><h3 style="margin-top:12px">'+d.title+'</h3><p class="note">المستوى '+level+' · استمع مرتين إذا احتجت</p><div class="row"><button class="btn" data-listen-play>🔊 تشغيل النص كاملاً</button><button class="btn ghost" data-listen-transcript>إظهار النص</button></div><div id="listenText" class="conv-answer" hidden dir="ltr" style="text-align:left;line-height:1.8">'+d.text+'</div><div id="listenQuestions"></div><div id="listenResult"></div>';const host=$('#listenQuestions');host.innerHTML=d.qs.map((q,i)=>'<div class="conv-card"><h4>السؤال '+(i+1)+'</h4><p dir="ltr" style="text-align:left">'+q[0]+'</p>'+q[1].map((o,j)=>'<label style="display:block;padding:7px"><input type="radio" name="lq'+i+'" value="'+j+'"> '+o+'</label>').join('')+'</div>').join('')+'<button class="btn" data-listen-check>صحح إجاباتي</button>';}
function play(){const d=current();if(!('speechSynthesis'in window)){alert('تشغيل الصوت غير مدعوم في هذا المتصفح.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.text);u.lang=S.accent==='UK'?'en-GB':'en-US';u.rate=S.slow?.78:.9;const v=voiceFor();if(v)u.voice=v;speechSynthesis.speak(u);}
document.addEventListener('click',e=>{const t=e.target;if(t.closest('[data-listen-level]')){level=t.closest('[data-listen-level]').dataset.listenLevel;render();return;}if(t.closest('[data-listen-open]')){itemIndex=+t.closest('[data-listen-open]').dataset.listenOpen;detail();return;}if(t.closest('[data-listen-back]')){render();return;}if(t.closest('[data-listen-play]')){play();return;}if(t.closest('[data-listen-transcript]')){$('#listenText').hidden=!$('#listenText').hidden;return;}if(t.closest('[data-listen-check]')){const d=current();let score=0,missing=0;d.qs.forEach((q,i)=>{const chosen=document.querySelector('input[name="lq'+i+'"]:checked');if(!chosen)missing++;else if(+chosen.value===q[2])score++;});$('#listenResult').innerHTML='<div class="conv-answer"><h4>نتيجتك: '+score+' من '+d.qs.length+'</h4><p>'+(missing?'لم تجب عن '+missing+' سؤال. ':'')+'راجع النص بعد المحاولة، ثم أعد التدريب لتحسين فهمك.</p>'+d.qs.map((q,i)=>'<p>'+(i+1)+'. الإجابة الصحيحة: '+q[1][q[2]]+'</p>').join('')+'</div>';return;}});
const old=renderSheet;renderSheet=function(){if(R.tab==='listening'){$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===R.tab));render();}else old();};
})();


/* ===== Guided writing practice: prompts, self-review and transparent feedback ===== */
(function(){
const TASKS=[
{level:'A1',items:[
{title:'Introduce yourself',ar:'عرّف بنفسك',task:'Write 4–5 sentences about yourself. Include your name, where you are from, your job or studies, and one thing you like.',hint:'I am… / I am from… / I work… / I like…',sample:'My name is Ali. I am from Yemen. I live in Saudi Arabia. I work in a shop. I like learning English.'},
{title:'My daily routine',ar:'روتيني اليومي',task:'Write 4–5 sentences about your normal day. Use simple present verbs.',hint:'I get up… / Then I… / I usually… / At night…',sample:'I get up at seven. I have breakfast. Then I go to work. I usually finish at six. At night, I study English.'}
]},
{level:'A2',items:[
{title:'A recent weekend',ar:'عطلة نهاية أسبوع مضت',task:'Write 6–8 sentences about your last weekend. Say where you went, who you were with, and what you did.',hint:'Last weekend… / We went… / I enjoyed… / It was…',sample:'Last weekend, I visited my friend. We went to a small restaurant and had dinner. After that, we walked in the park. The weather was pleasant. I enjoyed the evening because we had a good conversation.'},
{title:'Ask for information',ar:'طلب معلومات',task:'Write a short polite message asking a shop about the price, available colours, and delivery time of a product.',hint:'Hello, I would like to ask… / Do you have…? / How long does delivery take?',sample:'Hello, I would like to ask about this bag. How much does it cost? Do you have it in black? Also, how long does delivery take? Thank you.'}
]},
{level:'B1',items:[
{title:'A challenge you overcame',ar:'تحدٍّ تغلبت عليه',task:'Write 100–130 words about a challenge you faced. Explain the problem, what you did, and what you learned.',hint:'At first… / I decided to… / As a result… / I learned that…',sample:'A few months ago, I decided to improve my English. At first, it was difficult to study regularly because I was busy at work. I made a simple plan and studied for thirty minutes every evening. I also listened to short conversations and repeated useful sentences. After several weeks, I noticed that I could understand more and speak with greater confidence. I learned that small steps, repeated every day, can lead to real progress.'},
{title:'Give advice',ar:'تقديم نصيحة',task:'Write 100–130 words giving a friend advice about managing time while working and studying.',hint:'You should… / It would help to… / Try to… / If I were you…',sample:'If you work and study, it is important to organise your time. You should choose one or two clear priorities each day instead of making a very long list. It would also help to study for short periods and take regular breaks. Try to prepare your books and tasks before you begin. If I were you, I would reduce distractions during study time. Remember that a realistic plan is easier to follow than a perfect one.'}
]},
{level:'B2',items:[
{title:'Advantages and disadvantages of remote work',ar:'إيجابيات وسلبيات العمل عن بُعد',task:'Write 150–180 words discussing both benefits and drawbacks of working remotely. End with your opinion.',hint:'On the one hand… / However… / In addition… / Overall…',sample:'Remote work has become increasingly common, offering clear benefits as well as certain challenges. On the one hand, employees can save time and money by avoiding daily travel. They may also find it easier to organise their schedules. On the other hand, working from home can reduce face-to-face communication and make it difficult to separate professional and personal life. Some employees may also feel isolated. In my view, remote work is most effective when organisations provide clear expectations and regular opportunities for communication. A flexible approach, rather than a completely remote or office-based system, may suit many teams best.'},
{title:'A formal complaint',ar:'رسالة شكوى رسمية',task:'Write a formal email (150–180 words) to a company about a product that arrived damaged. Explain the issue and request a solution.',hint:'Dear… / I am writing to… / Unfortunately… / I would appreciate… / Yours sincerely,',sample:'Dear Customer Service Manager,\n\nI am writing to complain about a product I ordered from your website last week. Unfortunately, the item arrived with a cracked screen, although the package appeared undamaged. I have attached photographs and a copy of the receipt for your reference.\n\nI would appreciate it if you could arrange a replacement or issue a full refund. Please let me know whether the damaged item needs to be returned and, if so, how I should arrange collection.\n\nI look forward to your response.\n\nYours sincerely,\nSamir'}
]},
{level:'C1',items:[
{title:'Evaluate a proposal',ar:'تقييم مقترح',task:'Write 180–220 words evaluating a proposal to replace some in-person training with online courses. Consider benefits, limitations, and conditions for success.',hint:'The proposal offers… / A significant limitation… / Its effectiveness depends on… / On balance…',sample:'Replacing some in-person training with online courses could make professional development more accessible. Employees would be able to study at a convenient time, while organisations could reduce travel and venue costs. Nevertheless, accessibility should not be mistaken for effectiveness. Practical subjects may require supervised demonstrations, immediate feedback, or collaboration that is difficult to reproduce online. There is also a risk that employees will postpone self-paced modules when workloads increase. A blended model is therefore more persuasive than a complete replacement. Online materials could deliver foundational knowledge, while workshops could focus on discussion and practical application. To ensure that the approach succeeds, organisations should provide protected study time, accessible technical support, and clear methods of assessing learning outcomes. On balance, online training is valuable when it complements rather than automatically displaces face-to-face instruction.'},
{title:'Argue a position',ar:'الدفاع عن وجهة نظر',task:'Write 180–220 words responding to this statement: “Personal success depends more on discipline than talent.” Present a balanced argument and a clear conclusion.',hint:'It is often claimed… / This view is convincing insofar as… / Nevertheless… / Ultimately…',sample:'It is often claimed that discipline matters more than talent in achieving personal success. There is considerable force to this argument: natural ability may provide an initial advantage, but sustained effort is usually required to develop it. A talented learner who rarely practises may be overtaken by someone who works consistently and responds to feedback. Nevertheless, talent should not be dismissed entirely. Certain abilities can make particular tasks easier, and access to resources or support also affects what people can achieve. The relationship is therefore not a simple competition between two qualities. In my view, discipline is the more dependable factor because it is something people can deliberately strengthen. Talent may influence the starting point, but disciplined practice has a greater role in determining long-term progress.'}
]},
{level:'C2',items:[
{title:'Synthesize competing perspectives',ar:'تركيب وجهات نظر متعارضة',task:'Write 220–260 words synthesising two perspectives: technology increases access to information, but may weaken the quality of public debate. Weigh both claims and reach a nuanced conclusion.',hint:'While it is undeniable… / This account is incomplete… / The crucial distinction… / A more defensible conclusion…',sample:'Digital technology has radically widened access to information, enabling people to consult primary sources, specialist commentary, and perspectives that traditional media may overlook. This expansion can support informed participation, particularly for communities previously excluded from public discussion. Yet access alone does not guarantee understanding. The speed and volume of online communication can reward immediacy, emotional intensity, and simplified claims over careful examination. Moreover, recommendation systems may repeatedly expose users to familiar positions, although their effects vary across platforms and individuals. It would therefore be misleading either to celebrate technology as an automatic democratising force or to portray it as the inevitable cause of declining debate. The crucial distinction is between the availability of information and the conditions under which it is interpreted. Digital tools can enrich public reasoning when accompanied by media literacy, transparent editorial practices, and incentives for accuracy. Ultimately, technology changes the possibilities of debate; institutions, design choices, and users’ habits help determine whether those possibilities are realised.'},
{title:'Write a critical reflection',ar:'كتابة تأمل نقدي',task:'Write 220–260 words reflecting critically on whether measuring performance always improves the quality of work. Develop a qualified position with examples.',hint:'Measurement can… / The difficulty lies not in… but in… / This suggests… / A qualified position…',sample:'Measuring performance can clarify expectations, reveal patterns, and identify areas requiring support. In settings where outcomes are otherwise difficult to compare, carefully selected indicators may make decision-making more transparent. However, measurement is not a neutral activity. Once a particular indicator becomes a target, individuals and organisations may prioritise what is counted, even when it represents only part of the underlying objective. A school judged solely by examination results, for example, may devote less attention to curiosity, collaboration, or intellectual independence. This does not invalidate measurement; it exposes the importance of interpreting it. Quantitative evidence is most useful when combined with professional judgement, contextual knowledge, and qualitative feedback. It should inform a broader assessment rather than replace it. A defensible approach is therefore neither to measure everything nor to reject metrics altogether, but to ask what a measure captures, what it excludes, and how people may respond to it. Performance improves not simply because it is measured, but when measurement supports learning rather than narrow compliance.'}
]}
];
let level='A1',idx=0;

function openTask(){const d=group().items[idx];$('#sbody').innerHTML='<button class="btn ghost" data-write-back>← قائمة الكتابة</button><h3 style="margin-top:12px">'+d.title+'</h3><p>'+d.ar+'</p><div class="conv-card"><b>المطلوب</b><p>'+d.task+'</p><p class="note">عبارات مساعدة: <span dir="ltr">'+d.hint+'</span></p></div><label for="writeDraft"><b>اكتب إجابتك بالإنجليزية</b></label><textarea id="writeDraft" rows="9" placeholder="Write your answer here..." dir="auto" style="width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;line-height:1.7"></textarea><p id="writeCount" class="note">عدد الكلمات: 0</p><div class="row"><button class="btn" data-write-review>راجع كتابتي</button><button class="btn ghost" data-write-sample>اعرض نموذجاً</button></div><div id="writeFeedback"></div><div id="writeSample" class="conv-answer" hidden><h4>نموذج مقترح — ليس الإجابة الوحيدة</h4><p dir="ltr" style="white-space:pre-wrap;text-align:left">'+esc(d.sample)+'</p></div>';}
function review(){const d=group().items[idx],box=$('#writeDraft'),raw=box.value.trim(),words=raw?raw.split(/\s+/).filter(Boolean):[],feedback=[];if(!raw){$('#writeFeedback').innerHTML='<p class="note">اكتب إجابتك أولاً، ثم اطلب المراجعة.</p>';return;}const low=raw.toLowerCase();const sentences=raw.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);if(words.length<12)feedback.push('إجابتك قصيرة جداً؛ أضف تفاصيل وأمثلة.');else feedback.push('لديك نص مكتوب من '+words.length+' كلمة.');if(sentences.length<2)feedback.push('حاول تقسيم أفكارك إلى جمل واضحة.');if(/\bi\s+[a-z]+/.test(low)&&!/(^|[.!?]\s*)i\b/.test(low))feedback.push('تحقق من كتابة الضمير I بحرف كبير في كل مرة.');if(/\bi am agree\b/.test(low))feedback.push('الأصح: I agree، وليس I am agree.');if(/\bhe go\b|\bshe go\b|\bit go\b/.test(low))feedback.push('مع he / she / it نضيف غالباً s للفعل في المضارع البسيط: goes.');if(/\byesterday\b|\blast\s+(week|month|year|night)\b/.test(low)&&/\b(go|eat|see|buy|come|have)\b/.test(low))feedback.push('ذكرت زمناً ماضياً؛ تأكد من استخدام صيغة الماضي للفعل.');if(/\b(a|an)\s+[aeiou][a-z]*/.test(low)&&/\ba\s+[aeiou]/.test(low))feedback.push('راجع a و an: نستخدم an قبل الصوت المتحرك غالباً.');if(!/[.!?]$/.test(raw))feedback.push('أضف علامة ترقيم في نهاية آخر جملة.');if(words.length>35&&!/\b(first|also|however|because|finally|therefore|in addition|on the other hand)\b/i.test(raw))feedback.push('اربط الأفكار بكلمات مثل because أو however أو in addition.');if(!feedback.length)feedback.push('لم أكتشف خطأً من القواعد البسيطة التي يفحصها هذا التدريب؛ راجع المعنى والترابط وعلامات الترقيم بنفسك.');$('#writeFeedback').innerHTML='<div class="conv-answer"><h4>ملاحظات أولية</h4><ul>'+feedback.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="note">هذه مراجعة محدودة تعتمد على أنماط بسيطة، وقد لا تكتشف كل الأخطاء أو قد تفوّت سياقاً مهماً. قارن كتابتك بالنموذج، ولا تنسخ النموذج حرفياً.</p></div>';}

(()=>{
const levels=['A1','A2','B1','B2','C1','C2'];
const tests={
A1:{reading:{title:'Reading: A simple day',passage:'My name is Lina. I live in a small town. I work in a shop from Sunday to Thursday. I start at nine o’clock. After work, I visit my sister. We drink tea and talk.',q:[['Where does Lina work?',['In a shop','In a school','At a hospital'],0],['When does she start work?',['At eight','At nine','At ten'],1],['Who does she visit after work?',['Her mother','Her friend','Her sister'],2]]},listening:{title:'Listening: At the café',audio:'Hello. Can I have a small coffee and a cheese sandwich, please? Of course. Would you like sugar? No, thank you. How much is it? It is six dollars.',q:[['What does the customer order?',['Tea and cake','Coffee and a sandwich','Juice and bread'],1],['Does the customer want sugar?',['Yes','No','Not mentioned'],1],['How much is it?',['Four dollars','Five dollars','Six dollars'],2]]},writing:{title:'Writing: Introduce yourself',task:'Write 4–6 sentences about your name, country, job or studies, and one thing you like.',min:4},speaking:{title:'Speaking: Introduce yourself',task:'Speak for 30–45 seconds. Say your name, where you are from, what you do, and one thing you like.',min:30}},
A2:{reading:{title:'Reading: A weekend plan',passage:'Last Friday, Omar planned a short trip with two friends. They took the early bus to the coast because the weather was expected to be sunny. They walked along the beach, ate lunch at a small restaurant, and returned home before dark. Omar enjoyed the trip, although the bus journey was longer than he expected.',q:[['How did they travel?',['By car','By bus','By train'],1],['Why did they choose the coast?',['The weather was expected to be sunny','It was cheaper','They had family there'],0],['What did Omar think about the journey?',['It was shorter than expected','It was too expensive','It was longer than expected'],2]]},listening:{title:'Listening: Changing an appointment',audio:'Good afternoon. I’m calling about my appointment on Tuesday. I’m afraid I can’t come at ten. Do you have anything available after lunch? We have a time at two thirty. That would be perfect. Thank you for your help.',q:[['When is the original appointment?',['Monday','Tuesday','Wednesday'],1],['Why does the caller need a change?',['Cannot come at ten','Feels unwell','Will be travelling'],0],['What new time is offered?',['One thirty','Two thirty','Three thirty'],1]]},writing:{title:'Writing: Describe a recent day',task:'Write 6–8 sentences about a day you enjoyed. Include where you went, what you did, and how you felt.',min:6},speaking:{title:'Speaking: Give directions',task:'Speak for about one minute explaining how to get from your home to a nearby shop or public place. Use sequence words.',min:45}},
B1:{reading:{title:'Reading: Learning at work',passage:'When the company introduced a new booking system, some employees were worried that it would make their work more complicated. The manager therefore arranged short training sessions and invited staff to report problems during the first month. The change was not completely smooth: a few records were entered incorrectly, and customers sometimes had to wait longer. However, after the team shared practical suggestions, the system became easier to use and appointments were managed more reliably.',q:[['Why were some employees worried?',['The system might complicate their work','Their hours would change','The office would close'],0],['What did the manager arrange?',['A pay rise','Training sessions','A new office'],1],['What helped improve the system?',['Hiring more customers','Ignoring errors','Staff suggestions'],2]]},listening:{title:'Listening: A delayed delivery',audio:'I’m calling to let you know that your order will arrive one day later than planned. The supplier has experienced a transport problem. We have already arranged a replacement vehicle, and your parcel should reach you by Thursday afternoon. I apologise for the inconvenience and will send you an update tomorrow.',q:[['How late will the order be?',['One day','Two days','One week'],0],['What caused the delay?',['Bad weather','A transport problem','A staff meeting'],1],['When should the parcel arrive?',['Wednesday morning','Thursday afternoon','Friday evening'],1]]},writing:{title:'Writing: Give your opinion',task:'Write 100–130 words: Is practical experience more valuable than formal education? Give reasons and an example.',min:90},speaking:{title:'Speaking: Solve a customer problem',task:'Speak for 1–2 minutes. Explain how you would respond to a customer who received the wrong item, and suggest a fair solution.',min:60}},
B2:{reading:{title:'Reading: Flexible working',passage:'Flexible working arrangements are often presented as a straightforward way to improve employee satisfaction. In practice, their success depends on more than allowing staff to work from home. Teams need clear expectations, suitable technology, and opportunities for informal communication. Without these, employees may experience isolation or uncertainty about priorities. Nevertheless, when managers focus on outcomes rather than physical presence, flexible arrangements can widen access to jobs and reduce unnecessary commuting. The strongest approach is usually adapted to the nature of the work rather than imposed uniformly.',q:[['What is the main argument?',['Remote work always succeeds','Flexible work requires supporting conditions','Offices are no longer useful'],1],['What may happen without clear support?',['Employees may feel isolated','Salaries automatically rise','Work becomes shorter'],0],['What approach does the writer favour?',['One rule for every job','A complete return to offices','Adapting arrangements to the work'],2]]},listening:{title:'Listening: Project review',audio:'Overall, the campaign performed better than we had anticipated, particularly in terms of website visits. However, the increase in visits did not translate into an equivalent rise in sales. The data suggests that the landing page may not have communicated the offer clearly enough. I recommend testing two alternative versions before we increase the advertising budget.',q:[['What exceeded expectations?',['Sales','Website visits','Customer complaints'],1],['What did not rise equally?',['Sales','Website visits','Social media posts'],0],['What is recommended?',['End the campaign','Increase the budget immediately','Test two landing pages'],2]]},writing:{title:'Writing: Balanced argument',task:'Write 160–190 words discussing whether cities should invest more in public transport than roads. Present both sides and your position.',min:145},speaking:{title:'Speaking: Present and defend a proposal',task:'Speak for 2 minutes proposing one improvement to a workplace or community. Explain benefits, possible drawbacks, and how to implement it.',min:90}},
C1:{reading:{title:'Reading: Evidence and policy',passage:'Policy debates frequently rely on headline statistics, yet figures rarely speak for themselves. A decline in reported incidents, for instance, may indicate that a policy is working; alternatively, it may reflect changes in reporting behaviour or data collection. Responsible interpretation therefore requires attention to methodology, comparison groups, and the broader context. This does not mean quantitative evidence should be dismissed. Rather, it should be treated as one component of an argument whose strength depends on the quality of the underlying assumptions and the plausibility of competing explanations.',q:[['What caution does the passage emphasise?',['Statistics require contextual interpretation','Numbers are always misleading','Policy should ignore data'],0],['A decline in reported incidents might reflect…',['Only policy success','Changes in reporting behaviour','A larger population'],1],['How should quantitative evidence be used?',['As the sole basis for decisions','Not at all','As one component of an argument'],2]]},listening:{title:'Listening: Research discussion',audio:'The initial findings are encouraging, but I would hesitate to draw a firm conclusion at this stage. The sample is relatively small, and the participants were recruited from a narrow range of institutions. A follow-up study involving a more diverse group would help establish whether the pattern holds beyond the original setting. We should describe the current result as suggestive rather than conclusive.',q:[['How does the speaker view the findings?',['Promising but preliminary','Completely invalid','Conclusive'],0],['What is a limitation?',['The study took too long','The sample is small and narrow','There were no findings'],1],['What is recommended?',['Stop the research','Publish a firm conclusion','Conduct a more diverse follow-up study'],2]]},writing:{title:'Writing: Critical analysis',task:'Write 200–230 words analysing whether technological convenience always leads to better outcomes. Qualify your claims and use examples.',min:180},speaking:{title:'Speaking: Evaluate a complex issue',task:'Speak for 2–3 minutes evaluating the benefits and risks of using AI in education. Distinguish evidence from opinion and reach a nuanced conclusion.',min:120}},
C2:{reading:{title:'Reading: The limits of certainty',passage:'Intellectual confidence is sometimes mistaken for the absence of doubt. Yet sophisticated judgement often consists precisely in recognising where certainty ends and interpretation begins. This is not an invitation to relativism: some explanations are demonstrably better supported than others. It is, rather, an insistence that conclusions remain proportionate to the evidence, that anomalies are not explained away merely because they are inconvenient, and that revisions of belief need not be regarded as intellectual defeat. A position is strongest not when it is immune to scrutiny, but when it has survived serious scrutiny while remaining open to warranted revision.',q:[['What distinction does the passage make?',['Doubt and ignorance are identical','Judgement can include awareness of uncertainty','All interpretations are equally valid'],1],['The writer rejects…',['Evidence-based conclusions','Careful revision','Relativism and unsupported certainty'],2],['When is a position strongest?',['When it survives scrutiny and remains revisable','When nobody questions it','When it never changes'],0]]},listening:{title:'Listening: Editorial judgement',audio:'I would resist framing the issue as a choice between innovation and regulation. That opposition is rhetorically convenient, but analytically crude. The more pertinent question is whether particular safeguards are proportionate to demonstrable risks, and whether they can be revised as evidence develops. Poorly designed rules may entrench incumbents; an absence of oversight may transfer substantial costs to those least able to bear them. The challenge, then, is institutional design rather than a blanket endorsement of either position.',q:[['What does the speaker criticise?',['A simplistic opposition between innovation and regulation','All forms of innovation','Evidence-based safeguards'],0],['What should safeguards be proportionate to?',['Political popularity','Demonstrable risks','Company size'],1],['What is described as the real challenge?',['Removing all rules','Choosing one extreme','Designing effective institutions'],2]]},writing:{title:'Writing: Synthesis and nuance',task:'Write 230–260 words synthesising the tension between individual freedom and collective responsibility. Develop a qualified, coherent position.',min:210},speaking:{title:'Speaking: Nuanced argument',task:'Speak for 3 minutes on this question: Should expertise carry greater weight than public opinion in major policy decisions? Address competing principles and qualify your conclusion.',min:150}}
};
let lev='A1',skill='reading',answers={},attempted=false;
const root=()=>$('#sbody');
function escA(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function draw(){let d=tests[lev][skill],html='<p class="note">اختبارات مستقلة لكل مهارة. القراءة والاستماع لهما تصحيح آلي للأسئلة، أما الكتابة والمحادثة فتحتاجان تقييماً وفق المعايير المعروضة ولا ندّعي تصحيحاً آلياً كاملاً.</p><div class="conv-levels">'+levels.map(x=>'<button data-ass-level="'+x+'" aria-pressed="'+(lev===x)+'">'+x+'</button>').join('')+'</div><div class="conv-levels">'+[['reading','القراءة'],['listening','الاستماع'],['writing','الكتابة'],['speaking','المحادثة']].map(([k,v])=>'<button data-ass-skill="'+k+'" aria-pressed="'+(skill===k)+'">'+v+'</button>').join('')+'</div><div class="conv-card"><h3>'+d.title+' · '+lev+'</h3>';
if(skill==='reading')html+='<p dir="ltr" style="text-align:left;line-height:1.9">'+d.passage+'</p>';
if(skill==='listening')html+='<p class="note">استمع إلى النص دون قراءة نص مكتوب، ثم أجب عن الأسئلة.</p><button class="btn" data-ass-play>🔊 تشغيل الاستماع</button>';
if(skill==='writing')html+='<p>'+d.task+'</p><p class="note">المعيار: إنجاز المطلوب، وضوح الفكرة، التنظيم، المفردات، القواعد والترقيم. الحد الأدنى المقترح: '+d.min+' كلمة.</p><textarea id="assText" rows="9" placeholder="Write your answer in English..." dir="auto" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit"></textarea><p id="assWords" class="note">عدد الكلمات: 0</p><button class="btn" data-ass-rubric>اعرض قائمة التقييم</button><div id="assResult"></div>';
if(skill==='speaking')html+='<p>'+d.task+'</p><p class="note">المعيار: الطلاقة، وضوح النطق، تنوع المفردات، دقة القواعد، تنظيم الأفكار والاستجابة للمطلوب. يمكنك تسجيل صوتك بهاتفك والاستماع إليه لتقييمه.</p><button class="btn" data-ass-speak>🎤 ابدأ التسجيل</button><p id="assSpeakState" class="note">التسجيل يعتمد على دعم المتصفح وإذن الميكروفون.</p><div id="assRubric"></div>';
if(skill==='reading'||skill==='listening')html+=d.q.map((q,i)=>'<div style="margin:14px 0"><b>'+ (i+1)+'. '+q[0]+'</b>'+q[1].map((a,j)=>'<label style="display:block;margin:8px 0"><input type="radio" name="assq'+i+'" value="'+j+'"> '+a+'</label>').join('')+'</div>').join('')+'<button class="btn" data-ass-mark>صحح إجاباتي</button><div id="assResult"></div>';
html+='</div>';root().innerHTML=html;attempted=false;}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.assLevel){lev=t.dataset.assLevel;draw();}else if(t.dataset.assSkill){skill=t.dataset.assSkill;draw();}else if(t.hasAttribute('data-ass-play')){let u=window.speechSynthesis;if(!u){$('#assResult').textContent='المتصفح لا يدعم تشغيل النطق.';return;}u.cancel();let msg=new SpeechSynthesisUtterance(tests[lev].listening.audio);msg.lang='en-US';msg.rate=0.88;u.speak(msg);}else if(t.hasAttribute('data-ass-mark')){let q=tests[lev][skill].q,score=0,missing=0;q.forEach((x,i)=>{let a=document.querySelector('input[name="assq'+i+'"]:checked');if(!a)missing++;else if(+a.value===x[2])score++;});$('#assResult').innerHTML='<h4>نتيجتك: '+score+' / '+q.length+'</h4><p>'+(missing?'لم تجب عن '+missing+' سؤال. ':'')+'راجع الأسئلة وحاول فهم سبب كل إجابة.</p>'+q.map((x,i)=>'<p>'+(i+1)+'. الإجابة الصحيحة: <b>'+x[1][x[2]]+'</b></p>').join('');}else if(t.hasAttribute('data-ass-rubric')){$('#assResult').innerHTML='<h4>قيّم كتابتك من 0 إلى 2 لكل معيار</h4><ul><li>هل أجبت عن جميع أجزاء المطلوب؟</li><li>هل الأفكار مترابطة ومنظمة؟</li><li>هل استخدمت مفردات مناسبة ومتنوعة؟</li><li>هل القواعد والإملاء والترقيم دقيقة؟</li></ul><p>0 = يحتاج إلى تحسين · 1 = مقبول · 2 = جيد جداً. المجموع: 0–8. عدد كلماتك: '+($('#assText').value.trim()?$('#assText').value.trim().split(/\s+/).length:0)+'. هذه مراجعة ذاتية وليست درجة معيارية معتمدة.</p>';}else if(t.hasAttribute('data-ass-speak')){let state=$('#assSpeakState');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.textContent='التعرف على الكلام غير مدعوم في هذا المتصفح. سجّل صوتك بتطبيق التسجيل ثم استمع إليه وقيّمه بالمعايير.';$('#assRubric').innerHTML='<ul><li>هل تحدثت للمدة المطلوبة؟</li><li>هل أجبت عن السؤال مباشرة؟</li><li>هل رتبت أفكارك وقدمت أمثلة؟</li><li>هل كان النطق واضحاً والطلاقة مناسبة؟</li></ul>';return;}try{let rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;state.textContent='جارٍ الاستماع… تحدث الآن ثم أوقف الإذن من المتصفح.';rec.onresult=ev=>{let out='';for(let i=ev.resultIndex;i<ev.results.length;i++)out+=ev.results[i][0].transcript+' ';$('#assSpeakState').textContent='ما التقطه المتصفح: '+out;};rec.onerror=()=>state.textContent='تعذر استخدام الميكروفون. تحقق من الإذن أو سجّل صوتك خارج التطبيق.';rec.onend=()=>state.textContent+=' انتهى التعرف.';rec.start();setTimeout(()=>{try{rec.stop()}catch(_){}},120000);}catch(_){state.textContent='تعذر بدء الميكروفون؛ استخدم تطبيق التسجيل وقيّم نفسك بالمعايير.';}}});

const prev=renderSheet;renderSheet=function(){if(R.tab==='assessment'){$$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===R.tab));draw();}else prev();};
